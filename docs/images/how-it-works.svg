<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="how it works diagram">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#12181f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1280" height="430" rx="18" fill="url(#bg2)"/>
  <text x="640" y="56" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="30" font-weight="700" fill="#e6edf3" direction="rtl">كيف تعمل المهارة؟ — ٥ خطوات آمنة ينفّذها الوكيل تلقائيًا</text>

  <!-- 5 boxes, laid out RIGHT-to-LEFT (step 1 rightmost) -->
  <g font-family="Segoe UI, Tahoma, sans-serif">
    <!-- step 1 -->
    <rect x="1020" y="100" width="220" height="150" rx="14" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="1130" y="134" text-anchor="middle" font-size="34">🔍</text>
    <text x="1130" y="168" text-anchor="middle" font-size="19" fill="#e6edf3" direction="rtl">اكتشاف التطبيق</text>
    <text x="1130" y="196" text-anchor="middle" font-size="14.5" fill="#9fb0c3" direction="rtl">هل هو Electron؟ تحديد مسار</text>
    <text x="1130" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7d8da1">app.asar</text>

    <!-- step 2 -->
    <rect x="764" y="100" width="220" height="150" rx="14" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="874" y="134" text-anchor="middle" font-size="34">🛡️</text>
    <text x="874" y="168" text-anchor="middle" font-size="19" fill="#e6edf3" direction="rtl">فحص الحماية</text>
    <text x="874" y="196" text-anchor="middle" font-size="14.5" fill="#9fb0c3" direction="rtl">قراءة Electron Fuses —</text>
    <text x="874" y="218" text-anchor="middle" font-size="14.5" fill="#9fb0c3" direction="rtl">رفض آمن إن كانت مفعّلة</text>

    <!-- step 3 -->
    <rect x="508" y="100" width="220" height="150" rx="14" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
    <text x="618" y="134" text-anchor="middle" font-size="34">📦</text>
    <text x="618" y="168" text-anchor="middle" font-size="19" fill="#e6edf3" direction="rtl">استخراج آمن</text>
    <text x="618" y="196" text-anchor="middle" font-size="14.5" fill="#9fb0c3" direction="rtl">فك الأرشيف مع دمج ملفات</text>
    <text x="618" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7d8da1">.unpacked</text>

    <!-- step 4 -->
    <rect x="252" y="100" width="220" height="150" rx="14" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <text x="362" y="134" text-anchor="middle" font-size="34">💉</text>
    <text x="362" y="168" text-anchor="middle" font-size="19" fill="#e6edf3" direction="rtl">حقن الترقيع</text>
    <text x="362" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7ee787">dir="auto"</text>
    <text x="362" y="218" text-anchor="middle" font-size="14.5" fill="#9fb0c3" direction="rtl">سكربت خفيف يعمل تلقائيًا</text>

    <!-- step 5 -->
    <rect x="10" y="100" width="220" height="150" rx="14" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="120" y="134" text-anchor="middle" font-size="34">🔄</text>
    <text x="120" y="168" text-anchor="middle" font-size="19" fill="#e6edf3" direction="rtl">تبديل وإعادة تشغيل</text>
    <text x="120" y="196" text-anchor="middle" font-size="14.5" fill="#9fb0c3" direction="rtl">مراقب خفي ينتظر إغلاق</text>
    <text x="120" y="218" text-anchor="middle" font-size="14.5" fill="#9fb0c3" direction="rtl">التطبيق ثم يفعّل الترقيع</text>
  </g>

  <!-- arrows pointing left (RTL flow) -->
  <g stroke="#58a6ff" stroke-width="3.5">
    <line x1="1016" y1="175" x2="990" y2="175" marker-end="url(#arrow)"/>
    <line x1="760" y1="175" x2="734" y2="175" marker-end="url(#arrow)"/>
    <line x1="504" y1="175" x2="478" y2="175" marker-end="url(#arrow)"/>
    <line x1="248" y1="175" x2="236" y2="175" marker-end="url(#arrow)"/>
  </g>

  <!-- safety strip -->
  <rect x="10" y="300" width="1260" height="100" rx="14" fill="#0f2a18" stroke="#2ea043" stroke-opacity="0.55"/>
  <text x="640" y="338" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" fill="#7ee787" direction="rtl">🛡️ صفر حذف — النسخة الأصلية تُحفظ دائمًا كـ app.asar.pre-rtl-patch · تراجع بأمر واحد · إعادة تطبيق بعد التحديثات</text>
  <text x="640" y="372" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" fill="#9fb0c3" direction="rtl">الكود والأوامر تبقى بالإنجليزية LTR — فقط النصوص العربية تتحول للاتجاه الصحيح</text>
</svg>
